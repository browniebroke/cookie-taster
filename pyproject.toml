[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "cookie-taster"
version = "1.1.0"
description = "A tool to test cookiecutter templates"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Bruno Alla", email = "alla.brunoo@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "rich>=10",
  "typer>=0.15,<1",
]
urls."Bug Tracker" = "https://github.com/browniebroke/cookie-taster/issues"
urls.Changelog = "https://github.com/browniebroke/cookie-taster/blob/main/CHANGELOG.md"
urls.documentation = "https://cookie-taster.readthedocs.io"
urls.repository = "https://github.com/browniebroke/cookie-taster"
scripts.cookie-taster = "cookie_taster.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ty==0.0.78",
]
docs = [
  "furo>=2023.5.20; python_version>='3.11'",
  "myst-parser>=0.16; python_version>='3.11'",
  "sphinx>=4; python_version>='3.11'",
  "sphinx-autobuild>=2025,<2026; python_version>='3.11'",
]

[tool.ruff]
line-length = 88
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # flake8-docstrings
  "E",   # pycodestyle
  "F",   # pyflake
  "I",   # isort
  "RUF", # ruff specific
  "S",   # flake8-bandit
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D401", # First line of docstring should be in imperative mood
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."docs/conf.py" = [ "D100" ]
lint.per-file-ignores."setup.py" = [ "D100" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "S101",
]
lint.isort.known-first-party = [ "cookie_taster", "tests" ]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
src.exclude = [ "docs" ]
terminal.error-on-warning = true

[tool.pytest]
addopts = [ "-v", "-Wdefault", "--cov=cookie_taster", "--cov-report=term", "--cov-report=xml" ]
pythonpath = [ "src" ]

[tool.coverage]
run.branch = true
paths.source = [
  "src",
  ".tox/**/site-packages",
]
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
version_variables = [
  "docs/conf.py:release",
  "src/cookie_taster/__init__.py:__version__",
]
version_toml = [ "pyproject.toml:project.version" ]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.environment.keep_trailing_newline = true
changelog.exclude_commit_patterns = [
  'chore(?:\([^)]*?\))?: .+',
  'ci(?:\([^)]*?\))?: .+',
  'refactor(?:\([^)]*?\))?: .+',
  'style(?:\([^)]*?\))?: .+',
  'test(?:\([^)]*?\))?: .+',
  'build\((?!deps\): .+)',
  "Merged? .*",
  "Initial [Cc]ommit.*",         # codespell:ignore
]
